services:
  livetalking:
    image: livetalking:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LIVETALKING_REF: ${LIVETALKING_REF:-eaa2b91559a5c2ed6127e17728efd52b7c407a0d}
    platform: linux/amd64
    restart: unless-stopped
    init: true

    # Linux 主机网络让 WebRTC 使用宿主机 IP 和动态 UDP 端口，无需映射 ports。
    network_mode: host
    shm_size: "1gb"

    # 宿主机需安装 NVIDIA 驱动和 NVIDIA Container Toolkit。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

    environment:
      # 仅 chat 模式需要这个密钥；直接文本播报无需配置。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

    volumes:
      - type: bind
        source: ./models
        target: /opt/livetalking/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /opt/livetalking/data
        bind:
          create_host_path: false
      - model-cache:/root/.cache

    command:
      - --transport
      - webrtc
      - --model
      - wav2lip
      - --avatar_id
      - ${AVATAR_ID:-wav2lip256_avatar1}
      - --tts
      - edgetts
      - --REF_FILE
      - ${TTS_VOICE:-zh-CN-YunxiaNeural}
      - --batch_size
      - "${BATCH_SIZE:-16}"
      - --max_session
      - "${MAX_SESSION:-5}"
      - --listenport
      - "${HTTP_PORT:-8010}"

    # 检查 HTTP 页面是否可访问；不代表已经验证 WebRTC 音视频连接。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + sys.argv[1] + '/index.html', timeout=5).close()"
        - "${HTTP_PORT:-8010}"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-cache:
